<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario Restaurante</title>
</head>
<body>
  <h1>Control de Stock del Restaurante</h1>

  <!-- Formulario para agregar productos -->
  <h2>Agregar Producto</h2>
  <form id="form-agregar-producto">
    <input type="text" id="nombre-producto" placeholder="Nombre del producto" required>
    <input type="number" id="cantidad-producto" placeholder="Cantidad" required>
    <input type="number" id="minimo-producto" placeholder="Cantidad mínima" required>
    <input type="number" id="precio-producto" placeholder="Precio" required>
    <button type="submit">Agregar Producto</button>
  </form>

  <h2>Inventario</h2>
  <div id="inventario"></div>

    // Aquí puedes integrar tu lógica en JavaScript para interactuar con el DOM
  </script>
</body>
</html>
